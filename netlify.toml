[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"

# Les previsualitzacions (branques i pull requests) mostren també els articles en revisió
[context.deploy-preview.environment]
  ECONEXO_MOSTRAR_BORRADORES = "1"
[context.branch-deploy.environment]
  ECONEXO_MOSTRAR_BORRADORES = "1"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# El domini principal porta a la versió en català; el castellà és a /es/
[[redirects]]
  from = "/"
  to = "/ca/"
  status = 302
  force = true

# Adreces anteriors a l'arribada dels idiomes: porten a la versió en català
[[redirects]]
  from = "/aprender/*"
  to = "/ca/aprender/:splat"
  status = 301
