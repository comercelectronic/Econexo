[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"

# Les previsualitzacions (branques i pull requests) mostren també els articles en revisió
[context.deploy-preview.environment]
  ECONEXO_MOSTRAR_BORRADORES = "1"
[context.branch-deploy.environment]
  ECONEXO_MOSTRAR_BORRADORES = "1"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Adreces antigues dels personatges: ara és El mundo de ECO y NEXO
[[redirects]]
  from = "/videos/*"
  to = "/eco-y-nexo/"
  status = 301
[[redirects]]
  from = "/universo-cromo/*"
  to = "/eco-y-nexo/"
  status = 301

# Domini principal: ecoynexo.com (sense www)
[[redirects]]
  from = "https://www.ecoynexo.com/*"
  to = "https://ecoynexo.com/:splat"
  status = 301
  force = true
