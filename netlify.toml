[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"

# Les previsualitzacions (branques i pull requests) mostren també els articles en revisió
[context.deploy-preview.environment]
  ECONEXO_MOSTRAR_BORRADORES = "1"
[context.branch-deploy.environment]
  ECONEXO_MOSTRAR_BORRADORES = "1"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# La secció de vídeos ara forma part de l'Universo CROMO
[[redirects]]
  from = "/videos/*"
  to = "/universo-cromo/:splat"
  status = 301
