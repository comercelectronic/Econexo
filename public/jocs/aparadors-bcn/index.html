 get('open').onclick=()=>{const [cost,focus,rhythm,lighting,budget]=values();if(!slots.some(k=>k!=='libre')){get('status').textContent='Coloca al menos un producto antes de abrir.';return}fixed=true;game.querySelectorAll('button,select,input').forEach(b=>b.disabled=true);document.querySelector('.scene').classList.add('opening');get('status').textContent='Los primeros clientes se acercan…';setTimeout(()=>{const stars=Number(focus)+Number(rhythm)+Number(lighting);get('status').innerHTML='<div class="grade">'+('★'.repeat(stars)+'☆'.repeat(3-stars))+'</div><b>'+stars+' de 3 visitantes se detienen</b><ul>'+[focus?'Producto protagonista reconocido.':(n?'Expón exactamente dos velas.':'La tarta debe ocupar el centro.'),rhythm?'La composición comunica el encargo.':(n?'Repite las velas a los lados de una rama.':'Combina una sola tarta con un regalo.'),lighting?'La luz acompaña al producto.':(n?'Prueba la luz difusa.':'Prueba el foco central.'),budget?'Dentro del presupuesto.':'Exceso de '+(cost-m.budget)+' €. Ajusta el montaje.'].map(s=>'<li>'+s+'</li>').join('')+'</ul><button id="retry">Volver al taller</button> '+(stars>=2&&budget?'<button class="primary" id="next">Sellar encargo →</button>':'<p>Consigue dos estrellas y respeta el presupuesto para sellar el encargo.</p>');get('retry').onclick=workshop;if(get('next'))get('next').onclick=()=>{review[n]={slots:[...slots],stars,paint,light,cost};if(n===0){n++;observe()}else finish()};},750)}
}
function finish(){heading('Portafolio · Campaña completada','Persianas arriba');game.innerHTML='<p>Has conseguido '+review.reduce((s,r)=>s+r.stars,0)+' de 6 estrellas. Estos son tus dos escaparates.</p><div class="layout" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr))"></div><p><button class="primary" id="again">Volver a jugar</button></p>';review.forEach((r,i)=>{const b=document.createElement('article');b.innerHTML=scene()+'<h2>'+missions[i].name+'</h2><p>'+('★'.repeat(r.stars))+' · '+r.cost+' € · Luz '+r.light+'</p>';b.querySelector('.glass').style.setProperty('--bg',r.paint);b.querySelectorAll('.obj').forEach((s,j)=>s.textContent=catalog[r.slots[j]][0]);game.querySelector('.layout').append(b)});get('again').onclick=home}
home();
