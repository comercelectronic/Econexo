 ['Punto focal','La mirada tiende a detenerse donde hay más contraste, tamaño o aislamiento. Una sola jerarquía permite identificar rápidamente qué se ofrece.','Entrecierra los ojos. Si todos los objetos destacan por igual, deja más aire junto al producto principal.'],

 ['Escenificación','Una escena vincula el producto con una acción o un deseo de su público. El atrezo debe explicar la historia y dejar visible lo que se vende.','Imagina una persona usando el producto. Conserva solo las piezas que ayudan a entender esa situación.'],
 ['Asociación de productos','Dos artículos que se utilizan juntos ayudan a imaginar el uso del conjunto. La distancia y la orientación comunican su relación.','Acerca el complemento al producto principal y comprueba que sus contornos siguen separados.'],

 ['Planos y profundidad','Primer plano, plano medio y fondo permiten ordenar el escaparate. Una superposición parcial crea profundidad mientras mantiene reconocible el artículo.','Desplaza una estructura al fondo y comprueba qué partes del producto oculta.'],
 ['Contraste cromático','El contraste de luminosidad separa una silueta de su fondo. El color también puede agrupar piezas de una misma familia.','Prueba un fondo más claro y otro más oscuro. Compara dónde se recorta mejor el producto.'],

function evidence(i) {
  const entries = Object.values(saved.jobs).filter(job => job.design.i === i);
  if (!entries.length) return null;
  const scores = entries.map(job => evaluate(job.design));
  const best = scores.sort((a,b)=>b.filter(c=>c[0]).length/b.length-a.filter(c=>c[0]).length/a.length)[0];
  // The same fictional cohort in both trials: visibility, association, composition and light drive attention.
  return {pasantes:40, pantalla:16, vitrina:8+best.slice(0,5).reduce((v,c,k)=>v+(c[0]?[5,3,5,4,2][k]:0),0)};
}
