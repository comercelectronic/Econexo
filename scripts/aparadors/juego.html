function evidence(i) {

  const scores = entries.map(job => evaluate(job.design));
  const best = scores.sort((a,b)=>b.filter(c=>c[0]).length/b.length-a.filter(c=>c[0]).length/a.length)[0];
  // The same fictional cohort in both trials: visibility, association, composition and light drive attention.
  return {pasantes:40, pantalla:16, vitrina:8+best.slice(0,5).reduce((v,c,k)=>v+(c[0]?[5,3,5,4,2][k]:0),0)};
}
