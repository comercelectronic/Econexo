<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173e40"><title>Aparadors BCN · ECOyNEXO</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fbf3df;color:#193f40;font:16px/1.5 "DM Sans",system-ui,sans-serif}header,main,footer{max-width:1180px;margin:auto;padding:18px 4vw}header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #bea98d}header strong{letter-spacing:.12em}header a,a{color:inherit}main{padding-top:32px}.eyebrow,small{font:700 12px/1.6 "IBM Plex Mono",monospace;letter-spacing:.09em;text-transform:uppercase}.layout{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(240px,1fr);gap:22px;align-items:start}h1,h2{font:normal clamp(40px,6.8vw,86px)/.97 Georgia,serif;letter-spacing:-.055em;margin:10px 0 22px}h2{font-size:36px;letter-spacing:-.045em}p{margin:10px 0 16px}.scene{position:relative;isolation:isolate;overflow:hidden;aspect-ratio:2;background:#eab291 url(data:image/png;base64,__ESCENA__) center/100% 100%;image-rendering:pixelated;border-radius:8px;border:2px solid #244947}.glass{position:absolute;left:22.4%;top:49%;width:55.2%;height:25%;display:flex;align-items:end;gap:0;background:var(--bg,#eac29b);background-image:var(--beam,radial-gradient(ellipse at top,#fff8bd,transparent 70%));border-bottom:4px solid #8d6555}.bay{background:none;border:0;box-shadow:none;padding:0;width:33.33%;height:100%;position:relative;border-radius:0}.bay:after{content:"";position:absolute;background:#b27b59;height:var(--h);bottom:0;left:15%;right:15%;border-top:3px solid #e7b586}.obj{position:absolute;bottom:var(--h);left:0;right:0;font-size:clamp(16px,3.8vw,48px);line-height:1.04;text-align:center}.editing .bay:hover,.editing .bay:focus-visible{background:#fff7;outline:2px dashed #365d50;outline-offset:-3px}.walker{position:absolute;bottom:9%;left:-10%;animation:walk 14s linear infinite;font-size:clamp(18px,3.4vw,44px);filter:drop-shadow(1px 3px 0 #a17e78)}.second{animation-delay:-7s}.opening .walker{animation-duration:3s}@keyframes walk{to{left:105%}}@media(prefers-reduced-motion:reduce){.walker{animation:none;left:12%}.second{left:80%}}
.panel{background:#fffaf0;border:1px solid #cbbca2;border-radius:10px;padding:22px}.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:12px 0}.ticket{color:#a04936}.primary,button{cursor:pointer;font:inherit;color:#193f40;border:1px solid #8b9a84;border-radius:6px;padding:9px 13px;background:#fffcf3}.primary{background:#205b50;color:white;font-weight:700;border-color:#205b50;box-shadow:0 3px 0 #123c34}.primary:hover{background:#2a6b57}button:focus-visible,a:focus-visible{outline:3px solid #c95738;outline-offset:2px}button:disabled{opacity:.5;cursor:default}.palette{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 16px}button[aria-pressed=true]{background:#d6e6cc;border-color:#205b50;box-shadow:inset 0 0 0 1px #205b50}.photo{min-height:180px;background:#214745;color:white;border-radius:8px;overflow:hidden;text-align:center}.photo img{display:block;width:100%;max-height:430px;object-fit:contain}.credit,footer{font-size:13px}#status{min-height:1.6em}.grade{font-size:27px;color:#ae5636}.choices{display:grid;gap:8px}label{display:block;font-weight:bold}footer{border-top:1px solid #bea98d;margin-top:22px}textarea,select{font:inherit;max-width:100%;padding:7px}textarea{width:100%}@media(max-width:760px){.layout{grid-template-columns:1fr}.panel{padding:16px}main{padding-top:20px}.obj{font-size:6vw}}
</style><header><strong>ECOyNEXO</strong><a href="/simuladores/">Simuladores ↗</a></header><main><div id="kicker" class="eyebrow">Barcelona · Taller de escaparatismo</div><h1 id="title">Aparadors BCN</h1><div id="game"></div></main><footer>Dinamización del punto de venta · Actividades comerciales</footer>
<script>
const scores=__MOTOR__,photos=__FOTOS__;
const missions=[
 {shop:"Pastisseria Escribà",where:"Gran Via · Navidad de 2022",author:"Enric",license:"by/4.0",name:"La tarta protagonista",brief:"Una pastelería prepara regalos de Navidad. Sitúa una única tarta en el centro, acompáñala de un regalo y dirige el foco al producto estrella.",budget:75,q:"Un cliente busca un regalo navideño. ¿Qué observarías para saber si el escaparate le habla a ese cliente?",choices:["El número de baldosas de la acera","Cómo dialogan la decoración de temporada y el producto","La altura del edificio"],correct:1,lesson:"La decoración de temporada conecta el producto con la ocasión de compra."},
 {shop:"Cereria Subirà",where:"Barcelona · Fotografía de archivo, 2011",author:"Enfo",license:"by-sa/3.0",name:"El ritmo de las velas",brief:"Una cerería presenta una colección para el hogar. Coloca dos velas iguales en los extremos y una rama en el centro. Una luz difusa debe envolver el conjunto.",budget:68,q:"Busca formas repetidas en la foto. ¿Qué recurso trasladarías a una colección de velas?",choices:["Repetir una silueta para que la mirada recorra la colección","Dar a cada pieza un tamaño y un color aleatorios","Ocultar la colección detrás del cartel"],correct:0,lesson:"Repetir una forma crea ritmo y ayuda a reconocer una familia de productos."}
];
const catalog={libre:["","Vaciar",0],tarta:["🎂","Tarta",40],regalo:["🎁","Regalo",16],vela:["🕯️","Vela",22],rama:["🌿","Rama",10]};
const get=id=>document.getElementById(id),game=get("game");
let n=0,chosen="tarta",slots=[],light="central",paint="#eac29b",review=[],fixed=false;
function scene(edit=false){return '<div class="scene '+(edit?'editing':'')+'"><div class="glass">'+[0,1,2].map((_,i)=>'<'+(edit?'button':'div')+' class="bay" style="--h:'+([14,32,14][i])+'%" '+(edit?'data-slot="'+i+'"':'')+'><span class="obj"></span></'+(edit?'button':'div')+'>').join('')+'</div><span class="walker" aria-hidden="true">🚶🏽‍♀️</span><span class="walker second" aria-hidden="true">🚶🏻</span></div>'}
function fill(items){document.querySelectorAll('.bay').forEach((b,i)=>{b.querySelector('.obj').textContent=catalog[items[i]][0];b.setAttribute('aria-label',['Izquierda','Centro','Derecha'][i]+': '+catalog[items[i]][1])})}
function heading(a,b){get('kicker').textContent=a;get('title').textContent=b}
function home(){heading('Barcelona · Taller de escaparatismo','Aparadors BCN');game.innerHTML='<div class="layout"><div>'+scene()+'</div><aside class="panel"><small class="ticket">Turno de apertura</small><h2>Tu tienda sale a escena.</h2><p>Explora dos escaparates de Barcelona y monta tus propias campañas. Cuando levantes la persiana, verás qué atrae a los clientes.</p><button class="primary" id="start">▶ Jugar</button></aside></div>';fill(['regalo','tarta','rama']);get('start').onclick=()=>{n=0;review=[];observe()}}
function observe(){const m=missions[n];heading('Ruta de observación · Parada '+(n+1)+' de 2',m.shop);const file=decodeURIComponent(photos[n].split('/').pop());game.innerHTML='<div class="layout"><div><div class="photo"><img id="ref" src="'+photos[n]+'" alt="Escaparate real de '+m.shop+'"></div><p class="credit">'+m.where+' · <a target="_blank" rel="noopener" href="https://commons.wikimedia.org/wiki/File:'+encodeURIComponent(file)+'">Fotografía de '+m.author+'</a> · <a href="https://creativecommons.org/licenses/'+m.license+'/">Licencia CC '+m.license.toUpperCase()+'</a></p></div><aside class="panel"><small class="ticket">Ojo de escaparatista</small><h2>Lee la vitrina</h2><p>'+m.q+'</p><div class="choices"></div><p id="status" role="status"></p><button class="primary" hidden id="enter">Aceptar encargo →</button></aside></div>';get('ref').onerror=()=>{get('ref').alt='La foto no se ha cargado. Abre la fotografía original en el enlace inferior.'};m.choices.forEach((s,i)=>{const b=document.createElement('button');b.textContent=s;b.onclick=()=>{get('status').textContent=i===m.correct?m.lesson:'Fíjate en la relación entre los objetos expuestos y su público. Inténtalo otra vez.';if(i===m.correct){get('enter').hidden=false;document.querySelectorAll('.choices button').forEach(x=>x.disabled=true)}};document.querySelector('.choices').append(b)});get('enter').onclick=()=>{slots=['libre','libre','libre'];chosen=n?'vela':'tarta';light='lateral';paint='#eac29b';workshop()}}
function values(){return scores[n+':'+slots.join(':')+':'+light]}
function workshop(){fixed=false;const m=missions[n];heading('Taller · Encargo '+(n+1)+' de 2',m.name);game.innerHTML='<div class="layout"><div>'+scene(true)+'<div class="bar"><b id="balance"></b><span>Presupuesto '+m.budget+' €</span></div><div class="panel"><label>Piezas de montaje</label><div class="palette" id="tools"></div><p>Elige una pieza y toca su peana. También puedes arrastrarla al escaparate.</p><label>Luz <select id="light"><option value="central">Central · 16 €</option><option value="lateral">Lateral · 16 €</option><option value="difusa">Difusa · 8 €</option></select></label><label>Fondo <input aria-label="Color del fondo" id="color" type="color"></label></div></div><aside class="panel"><small class="ticket">Pedido del comercio</small><h2>'+m.name+'</h2><p>'+m.brief+'</p><button class="primary" id="open">Abrir al público →</button><div id="status" role="status"></div></aside></div>';
 function render(){fill(slots);const g=document.querySelector('.glass');g.style.setProperty('--bg',paint);g.style.setProperty('--beam',light==='difusa'?'linear-gradient(#fff6,transparent)':('radial-gradient(ellipse at '+(light==='central'?'50%':'8%')+' 5%,#ffedaf,transparent 70%)'));get('balance').textContent='Montaje · '+values()[0]+' €';document.querySelectorAll('#tools button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.key===chosen))}
 function edit(i,key){if(fixed)return;slots[i]=key;render();get('status').textContent=''}
 Object.entries(catalog).forEach(([k,[icon,label,price]])=>{const b=document.createElement('button');b.dataset.key=k;b.textContent=(icon||'×')+' '+label+' · '+price+' €';b.draggable=true;b.ondragstart=e=>e.dataTransfer.setData('text/plain',k);b.onclick=()=>{chosen=k;render()};get('tools').append(b)});
 document.querySelectorAll('.bay').forEach((b,i)=>{b.onclick=()=>edit(i,chosen);b.ondragover=e=>e.preventDefault();b.ondrop=e=>{e.preventDefault();let k=e.dataTransfer.getData('text/plain');if(Object.hasOwn(catalog,k))edit(i,k)}});
 get('color').value=paint;get('color').oninput=e=>{paint=e.target.value;render()};get('light').value=light;get('light').onchange=e=>{light=e.target.value;render()};render();
 get('open').onclick=()=>{const [cost,focus,rhythm,lighting,budget]=values();if(!slots.some(k=>k!=='libre')){get('status').textContent='Coloca al menos un producto antes de abrir.';return}fixed=true;game.querySelectorAll('button,select,input').forEach(b=>b.disabled=true);document.querySelector('.scene').classList.add('opening');get('status').textContent='Los primeros clientes se acercan…';setTimeout(()=>{const stars=Number(focus)+Number(rhythm)+Number(lighting);get('status').innerHTML='<div class="grade">'+('★'.repeat(stars)+'☆'.repeat(3-stars))+'</div><b>'+stars+' de 3 visitantes se detienen</b><ul>'+[focus?'Producto protagonista reconocido.':(n?'Expón exactamente dos velas.':'La tarta debe ocupar el centro.'),rhythm?'La composición comunica el encargo.':(n?'Repite las velas a los lados de una rama.':'Combina una sola tarta con un regalo.'),lighting?'La luz acompaña al producto.':(n?'Prueba la luz difusa.':'Prueba el foco central.'),budget?'Dentro del presupuesto.':'Exceso de '+(cost-m.budget)+' €. Ajusta el montaje.'].map(s=>'<li>'+s+'</li>').join('')+'</ul><button id="retry">Volver al taller</button> '+(stars>=2&&budget?'<button class="primary" id="next">Sellar encargo →</button>':'<p>Consigue dos estrellas y respeta el presupuesto para sellar el encargo.</p>');get('retry').onclick=workshop;if(get('next'))get('next').onclick=()=>{review[n]={slots:[...slots],stars,paint,light,cost};if(n===0){n++;observe()}else finish()};},750)}
}
function finish(){heading('Portafolio · Campaña completada','Persianas arriba');game.innerHTML='<p>Has conseguido '+review.reduce((s,r)=>s+r.stars,0)+' de 6 estrellas. Estos son tus dos escaparates.</p><div class="layout" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr))"></div><p><button class="primary" id="again">Volver a jugar</button></p>';review.forEach((r,i)=>{const b=document.createElement('article');b.innerHTML=scene()+'<h2>'+missions[i].name+'</h2><p>'+('★'.repeat(r.stars))+' · '+r.cost+' € · Luz '+r.light+'</p>';b.querySelector('.glass').style.setProperty('--bg',r.paint);b.querySelectorAll('.obj').forEach((s,j)=>s.textContent=catalog[r.slots[j]][0]);game.querySelector('.layout').append(b)});get('again').onclick=home}
home();
</script></html>
